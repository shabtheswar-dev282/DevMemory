services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devmemory
      POSTGRES_DB: devmemory
    ports:
      - "5432:5432"
    volumes:
      - devmemory_pgdata:/var/lib/postgresql/data

volumes:
  devmemory_pgdata:
